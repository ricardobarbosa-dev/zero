<!DOCTYPE html>

<body class="text-white min-h-screen">

                <label class="block">

                <label class="block">

                </label>

                <label class="block">

                </label>

                <label class="block">

                    Dicionários
                </label>

                <label class="block">

                    Arquivos
                </label>

                <label class="block">
                    <input type="checkbox" class="study-item">

            <h2 class="text-2xl font-bold mb-4 text-blue-400">
                🗄 SQL
            </h2>

            <div class="space-y-3">

                <label class="block">
                    <input type="checkbox" class="study-item">

                </label>

                <label class="block">
                    <input type="checkbox" class="study-item">

                <label class="block">
                    <input type="checkbox" class="study-item">

                <label class="block">
                    <input type="checkbox" class="study-item">

                </label>

                <label class="block">

                </label>

                <label class="block">

                </label>

                <label class="block">

                <label class="block">

                    Models
                </label>

                <label class="block">
                    <input type="checkbox" class="study-item">

                </label>

                <label class="block">
                    <input type="checkbox" class="study-item">

                <label class="block">

</div>

<script>
    const checkboxes = document.querySelectorAll('.study-item');

    function updateProgress() {

        const total = checkboxes.length;

        const checked =
            document.querySelectorAll('.study-item:checked').length;

        const percent =
            Math.round((checked / total) * 100);

        document.getElementById('progressBar').style.width =
            percent + '%';

        document.getElementById('progressText').innerText =
            percent + '%';

        const data = [];

        checkboxes.forEach(cb => {
            data.push(cb.checked);
        });

        localStorage.setItem(
            'roadmap-python-django',
            JSON.stringify(data)
        );
    }

    function loadProgress() {

        const saved =
            JSON.parse(
                localStorage.getItem('roadmap-python-django')
            );

        if (!saved) return;

        checkboxes.forEach((cb, index) => {
            cb.checked = saved[index];
        });

        updateProgress();
    }

    checkboxes.forEach(cb => {
        cb.addEventListener('change', updateProgress);
    });

    loadProgress();
</script>

</body>
</html>
